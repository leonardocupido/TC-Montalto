crons:
  - name: cleanup-past-matches
    description: "Deletes past matches and their applications every night at 3:00 (Italian time)"
    cron: "0 3 * * *"
    timezone: "Europe/Rome"
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    endpoint: "{{BASE_URL}}/api/cron/cleanup-past"
    method: POST
    enabled: true
